<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; background: #FFFFFF; }
    body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }

    .card {
      width: 1080px;
      height: 1080px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
    }

    /* 상단 바 */
    .top-bar {
      height: 72px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 100px;
      border-bottom: 2px solid #F1F5F9;
    }

    .category-chip {
      font-size: 14px;
      font-weight: 700;
      color: #4F46E5;
      background: #EEF2FF;
      border-radius: 100px;
      padding: 7px 20px;
    }

    .slide-dots { display: flex; gap: 9px; align-items: center; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #E2E8F0; }
    .dot.active { background: #4F46E5; width: 26px; border-radius: 5px; }

    /* 메인 콘텐츠 */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 52px 100px 44px;
      gap: 0;
    }

    /* 상단 레이블 */
    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      color: #4F46E5;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    /* 핵심 개념 제목 */
    .concept-title {
      font-size: 52px;
      font-weight: 900;
      color: #0F172A;
      letter-spacing: -0.03em;
      line-height: 1.2;
      word-break: keep-all;
      margin-bottom: 32px;
    }

    /* 구분선 */
    .divider {
      width: 100%;
      height: 2px;
      background: #E2E8F0;
      margin-bottom: 32px;
      flex-shrink: 0;
    }

    /* 왜 중요한가 */
    .why-label {
      font-size: 13px;
      font-weight: 700;
      color: #94A3B8;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .why-text {
      font-size: 22px;
      font-weight: 700;
      color: #4F46E5;
      line-height: 1.45;
      word-break: keep-all;
      margin-bottom: 28px;
    }

    /* 상세 설명 박스 */
    .detail-box {
      flex: 1;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 20px;
      border-left: 5px solid #4F46E5;
      padding: 32px 36px;
      display: flex;
      align-items: center;
    }

    .detail-text {
      font-size: 21px;
      font-weight: 500;
      color: #1E293B;
      line-height: 1.75;
      word-break: keep-all;
    }

    /* 하단 */
    .bottom-bar {
      height: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 100px;
      border-top: 2px solid #F1F5F9;
    }

    .tags { display: flex; gap: 10px; }
    .tag {
      font-size: 13px;
      font-weight: 700;
      color: #94A3B8;
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      color: #CBD5E1;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="top-bar">
      <span class="category-chip">{{ category }}</span>
      <div class="slide-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot active"></div>
      </div>
    </div>

    <div class="content">
      <div class="eyebrow">이것만큼은 꼭 잡고 가세요</div>
      <div class="concept-title">{{ key_concept.subject }}</div>
      <div class="divider"></div>
      <div class="why-label">왜 이게 제일 중요한가</div>
      <div class="why-text">{{ key_concept.why }}</div>
      <div class="detail-box">
        <div class="detail-text">{{ key_concept.detail }}</div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="tags">
        {% for tag in tags[:3] %}
        <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
      <span class="brand">infra.card</span>
    </div>

  </div>
</body>
</html>
