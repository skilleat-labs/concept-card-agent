<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; }
    body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; background: #FFFFFF; }

    .card {
      width: 1080px;
      height: 1080px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 상단 바 ── */
    .top-bar {
      height: 72px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #3730A3 0%, #4F46E5 60%, #7C3AED 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 52px;
    }
    .top-left { display: flex; align-items: center; gap: 14px; }
    .category-chip {
      font-size: 13px; font-weight: 700;
      color: rgba(255,255,255,0.95);
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      padding: 5px 16px;
      letter-spacing: 0.03em;
    }
    .top-title {
      font-size: 16px;
      font-weight: 700;
      color: rgba(255,255,255,0.60);
    }
    .slide-dots { display: flex; gap: 8px; align-items: center; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.30); }
    .dot.active { background: #FFFFFF; width: 26px; border-radius: 5px; }

    /* ── 섹션 헤더 ── */
    .section-header {
      padding: 38px 60px 26px;
      flex-shrink: 0;
    }
    .section-eyebrow {
      font-size: 12px;
      font-weight: 700;
      color: #94A3B8;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .section-title {
      font-size: 34px;
      font-weight: 900;
      color: #0F172A;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    /* 제목 옆 강조선 */
    .section-title::after {
      content: '';
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(90deg, #4F46E5 0%, rgba(124,58,237,0.0) 100%);
    }

    /* ── 스토리 카드 ── */
    .story-container {
      flex: 1;
      margin: 0 52px;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 22px;
      padding: 42px 54px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      min-height: 0;
    }
    .story-text {
      font-size: 27px;
      font-weight: 500;
      color: #1E293B;
      line-height: 1.82;
      word-break: keep-all;
    }
    /* 색상 강조 키워드 */
    .story-text em.blue   { color: #4F46E5; font-style: normal; font-weight: 700; }
    .story-text em.green  { color: #059669; font-style: normal; font-weight: 700; }
    .story-text em.orange { color: #EA580C; font-style: normal; font-weight: 700; }
    .story-text em.red    { color: #DC2626; font-style: normal; font-weight: 700; }

    /* ── 태그 푸터 ── */
    .footer {
      padding: 20px 60px 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      font-size: 15px;
      font-weight: 700;
      color: #4F46E5;
      background: #EEF2FF;
      border-radius: 100px;
      padding: 5px 17px;
    }
    .brand {
      font-size: 13px;
      font-weight: 700;
      color: #CBD5E1;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="top-bar">
      <div class="top-left">
        <span class="category-chip">{{ category }}</span>
        <span class="top-title">{{ title }}</span>
      </div>
      <div class="slide-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot active"></div>
      </div>
    </div>

    <div class="section-header">
      <div class="section-eyebrow">PRACTICAL USE</div>
      <div class="section-title">💼 실무에서는 이렇게 씁니다</div>
    </div>

    <div class="story-container">
      <div class="story-text">{{ story | safe }}</div>
    </div>

    <div class="footer">
      <div class="tags">
        {% for tag in tags %}
        <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
      <span class="brand">infra.card</span>
    </div>

  </div>
</body>
</html>
