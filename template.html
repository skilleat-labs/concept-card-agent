<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: #F5F6FA;
    }
    .card {
      width: 1080px;
      height: 1350px;
      background: #F5F6FA;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 헤더 (Navy) ── */
    .header {
      background: #1A1A35;
      padding: 28px 52px 24px 52px;
      flex-shrink: 0;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .category-chip {
      font-size: 13px;
      font-weight: 700;
      color: #7B9EFF;
      background: rgba(43,79,232,0.18);
      border: 1px solid rgba(43,79,232,0.35);
      border-radius: 5px;
      padding: 3px 12px;
      letter-spacing: 0.05em;
    }
    .title-label {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.05em;
    }

    /* 훅 — 가장 크게, 가장 먼저 눈에 들어와야 함 */
    .hook {
      font-size: 52px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.2;
      letter-spacing: -0.025em;
      word-break: keep-all;
    }
    /* 훅 안의 강조 단어 */
    .hook em {
      color: #7B9EFF;
      font-style: normal;
    }

    /* ── 다이어그램 ── */
    .diagram-wrap {
      background: #FFFFFF;
      margin: 18px 40px 0 40px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(26,26,53,0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 400px;
    }
    .diagram-wrap svg {
      width: 936px;
      height: 380px;
      display: block;
    }

    /* ── 정의 ── */
    .definition-row {
      margin: 14px 40px 0 40px;
      background: #2B4FE8;
      border-radius: 10px;
      padding: 13px 24px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .definition-label {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .definition-divider {
      width: 1px;
      height: 30px;
      background: rgba(255,255,255,0.2);
      flex-shrink: 0;
    }
    .definition-text {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.45;
      word-break: keep-all;
    }

    /* ── 세로 스택 섹션 ── */
    .sections {
      display: flex;
      flex-direction: column;
      margin: 14px 40px 0 40px;
      background: #FFFFFF;
      border-radius: 14px;
      overflow: hidden;
      flex: 1;
      box-shadow: 0 1px 6px rgba(26,26,53,0.05);
    }
    .section {
      display: flex;
      align-items: stretch;
      flex: 1;
    }
    .section + .section {
      border-top: 1px solid #F0F0F6;
    }

    /* 왼쪽 라벨 */
    .section-label-col {
      width: 190px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      background: #FAFAFE;
      border-right: 1px solid #F0F0F6;
    }
    .section-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-why       { background: #2B4FE8; }
    .dot-usage     { background: #4CAF50; }
    .dot-confusion { background: #E53935; }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      word-break: keep-all;
      line-height: 1.45;
    }
    .label-why       { color: #2B4FE8; }
    .label-usage     { color: #388E3C; }
    .label-confusion { color: #C62828; }

    /* 오른쪽 내용 */
    .section-content {
      flex: 1;
      padding: 12px 22px;
      font-size: 24px;
      font-weight: 500;
      color: #1A1A35;
      line-height: 1.55;
      word-break: keep-all;
      display: flex;
      align-items: center;
    }

    /* ── 푸터 ── */
    .footer {
      margin: 10px 40px 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .tag {
      font-size: 14px;
      font-weight: 700;
      color: #2B4FE8;
      background: rgba(43,79,232,0.08);
      border-radius: 100px;
      padding: 4px 13px;
    }
    .brand {
      font-size: 13px;
      font-weight: 700;
      color: #8B8FA8;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- 헤더 -->
    <div class="header">
      <div class="header-top">
        <span class="category-chip">{{ category }}</span>
        <span class="title-label">{{ title }}</span>
      </div>
      <div class="hook">{{ hook }}</div>
    </div>

    <!-- 다이어그램 -->
    <div class="diagram-wrap">
      {{ diagram_svg }}
    </div>

    <!-- 정의 -->
    <div class="definition-row">
      <div class="definition-label">Definition</div>
      <div class="definition-divider"></div>
      <div class="definition-text">{{ definition }}</div>
    </div>

    <!-- 세로 스택 섹션 -->
    <div class="sections">
      <div class="section">
        <div class="section-label-col">
          <div class="section-dot dot-why"></div>
          <span class="section-label label-why">왜 알아야<br>하나</span>
        </div>
        <div class="section-content">{{ why }}</div>
      </div>
      <div class="section">
        <div class="section-label-col">
          <div class="section-dot dot-usage"></div>
          <span class="section-label label-usage">어디서<br>쓰이나</span>
        </div>
        <div class="section-content">{{ usage }}</div>
      </div>
      <div class="section">
        <div class="section-label-col">
          <div class="section-dot dot-confusion"></div>
          <span class="section-label label-confusion">헷갈리면<br>안 되는 것</span>
        </div>
        <div class="section-content">{{ confusion }}</div>
      </div>
    </div>

    <!-- 푸터 -->
    <div class="footer">
      <div class="tags">
        {% for tag in tags %}
        <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
      <span class="brand">infra.card</span>
    </div>

  </div>
</body>
</html>
