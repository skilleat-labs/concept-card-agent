<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; background: #FFFFFF; }
    body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }

    .card {
      width: 1080px;
      height: 1080px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      padding: 72px 120px;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .category-chip {
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
      background: #4F46E5;
      border-radius: 100px;
      padding: 9px 24px;
      letter-spacing: 0.02em;
    }

    .slide-dots {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #E2E8F0;
    }
    .dot.active {
      background: #4F46E5;
      width: 30px;
      border-radius: 5px;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 36px;
    }

    .icon {
      font-size: 100px;
      line-height: 1;
    }

    .hook {
      font-size: 68px;
      font-weight: 900;
      color: #0F172A;
      line-height: 1.28;
      letter-spacing: -0.03em;
      word-break: keep-all;
    }

    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .tagline {
      font-size: 15px;
      font-weight: 700;
      color: #94A3B8;
      letter-spacing: 0.02em;
    }

    .brand {
      font-size: 14px;
      font-weight: 700;
      color: #CBD5E1;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="top-row">
      <span class="category-chip">{{ category }}</span>
      <div class="slide-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="main-content">
      <div class="icon">{{ icon }}</div>
      <div class="hook">{{ hook | safe }}</div>
    </div>

    <div class="bottom-row">
      <span class="tagline">주니어 취준 생존 가이드</span>
      <span class="brand">infra.card</span>
    </div>

  </div>
</body>
</html>
