<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; }
    body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }

    .card {
      width: 1080px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 상단 컬러 히어로 블록 ── */
    .hero {
      height: 470px;
      flex-shrink: 0;
      background: linear-gradient(145deg, #3730A3 0%, #4F46E5 45%, #7C3AED 100%);
      display: flex;
      flex-direction: column;
      padding: 44px 60px 50px;
      position: relative;
      overflow: hidden;
    }
    /* 배경 장식 원형 글로우 */
    .hero::before {
      content: '';
      position: absolute;
      width: 560px; height: 560px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 65%);
      top: -160px; right: -80px;
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
      bottom: -60px; left: 60px;
      pointer-events: none;
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .category-chip {
      font-size: 14px;
      font-weight: 700;
      color: rgba(255,255,255,0.95);
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 8px;
      padding: 7px 20px;
      letter-spacing: 0.04em;
    }
    .slide-dots { display: flex; gap: 9px; align-items: center; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.32); }
    .dot.active { background: #FFFFFF; width: 28px; border-radius: 5px; }

    .hero-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      z-index: 1;
    }
    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .eyebrow::before {
      content: '';
      width: 22px; height: 2px;
      background: rgba(255,255,255,0.40);
      border-radius: 1px;
    }
    .hook {
      font-size: 62px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.22;
      letter-spacing: -0.03em;
      word-break: keep-all;
    }

    /* ── 하단 화이트 섹션 ── */
    .lower {
      flex: 1;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      padding: 28px 52px 30px;
    }

    /* 다이어그램 컨테이너 */
    .diagram-container {
      flex: 1;
      background: #0F172A;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .diagram-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 하단 힌트 행 */
    .bottom-row {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .next-hint {
      font-size: 18px;
      font-weight: 700;
      color: #4F46E5;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .next-hint::after { content: '→'; }
    .brand {
      font-size: 13px;
      font-weight: 700;
      color: #CBD5E1;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- 상단: 궁금증 유발 히어로 -->
    <div class="hero">
      <div class="hero-top">
        <span class="category-chip">{{ category }}</span>
        <div class="slide-dots">
          <div class="dot active"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
      <div class="hero-body">
        <div class="eyebrow">오늘의 질문</div>
        <div class="hook">{{ hook | safe }}</div>
      </div>
    </div>

    <!-- 하단: 다이어그램 미리보기 -->
    <div class="lower">
      <div class="diagram-container">
        {{ diagram_svg | safe }}
      </div>
      <div class="bottom-row">
        <span class="next-hint">다음 카드에서 확인하세요</span>
        <span class="brand">infra.card</span>
      </div>
    </div>

  </div>
</body>
</html>
