<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: #1A1A35;
    }
    .card {
      width: 1080px;
      height: 1080px;
      background: #1A1A35;
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    /* 배경 장식 */
    .deco-ring {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .deco-ring-1 {
      width: 680px; height: 680px;
      border: 1.5px solid rgba(43,79,232,0.14);
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
    }
    .deco-ring-2 {
      width: 460px; height: 460px;
      border: 1px solid rgba(123,158,255,0.09);
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
    }
    .deco-dot-tl {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #2B4FE8;
      left: 88px; top: 96px;
    }
    .deco-dot-br {
      position: absolute;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #7B9EFF;
      right: 108px; bottom: 108px;
    }

    /* 상단 바 */
    .top-bar {
      padding: 40px 56px 0 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }
    .category-chip {
      font-size: 13px;
      font-weight: 700;
      color: #7B9EFF;
      background: rgba(43,79,232,0.2);
      border: 1px solid rgba(43,79,232,0.35);
      border-radius: 6px;
      padding: 4px 14px;
      letter-spacing: 0.05em;
    }
    .brand {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.05em;
    }

    /* 중앙 콘텐츠 — 완전 중앙 정렬 */
    .center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 60px;
      gap: 32px;
      position: relative;
      z-index: 1;
    }

    /* 캐릭터 */
    .character { flex-shrink: 0; }

    /* 훅 */
    .hook {
      font-size: 64px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.2;
      letter-spacing: -0.03em;
      word-break: keep-all;
    }
    .hook em { color: #7B9EFF; font-style: normal; }

    /* 태그라인 */
    .tagline {
      width: 100%;
      background: #2B4FE8;
      border-radius: 16px;
      padding: 22px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tagline-text {
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.01em;
      word-break: keep-all;
    }

    /* 하단 점 */
    .bottom-bar {
      padding: 0 56px 38px 56px;
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    .dots { display: flex; gap: 8px; align-items: center; }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
    }
    .dot.active {
      background: #7B9EFF;
      width: 26px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="deco-ring deco-ring-1"></div>
    <div class="deco-ring deco-ring-2"></div>
    <div class="deco-dot-tl"></div>
    <div class="deco-dot-br"></div>

    <!-- 상단 -->
    <div class="top-bar">
      <span class="category-chip">{{ category }}</span>
      <span class="brand">infra.card</span>
    </div>

    <!-- 중앙 콘텐츠 (수직 중앙) -->
    <div class="center-content">
      <div class="character">
        <svg width="190" height="168" viewBox="0 0 190 168" xmlns="http://www.w3.org/2000/svg"
             font-family="'Noto Sans KR', sans-serif">
          <circle cx="84" cy="88" r="62" fill="#2B4FE8" opacity="0.14"/>
          <circle cx="84" cy="88" r="54" fill="none" stroke="#7B9EFF" stroke-width="1.5" opacity="0.4"/>
          <!-- 눈썹 -->
          <path d="M58 66 Q67 59 76 65" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <path d="M92 65 Q101 59 110 66" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <!-- 눈 -->
          <ellipse cx="70" cy="80" rx="7" ry="7" fill="#FFFFFF"/>
          <ellipse cx="98" cy="80" rx="7" ry="7" fill="#FFFFFF"/>
          <circle cx="71" cy="80" r="3.5" fill="#1A1A35"/>
          <circle cx="99" cy="80" r="3.5" fill="#1A1A35"/>
          <circle cx="73" cy="78" r="1.5" fill="#FFFFFF"/>
          <circle cx="101" cy="78" r="1.5" fill="#FFFFFF"/>
          <!-- 입 -->
          <path d="M70 108 Q84 103 98 108" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
          <!-- 볼 홍조 -->
          <ellipse cx="56" cy="97" rx="10" ry="6" fill="#FF6B6B" opacity="0.3"/>
          <ellipse cx="112" cy="97" rx="10" ry="6" fill="#FF6B6B" opacity="0.3"/>
          <!-- 물음표 -->
          <text x="144" y="52" font-size="54" font-weight="900" fill="#7B9EFF" opacity="0.95">?</text>
          <text x="14" y="48" font-size="34" font-weight="900" fill="#2B4FE8" opacity="0.65">?</text>
          <text x="142" y="110" font-size="20" font-weight="700" fill="#7B9EFF" opacity="0.4">?</text>
        </svg>
      </div>

      <div class="hook">{{ hook | safe }}</div>

      <div class="tagline">
        <span class="tagline-text">개발자·엔지니어가 꼭 알아야 할 인프라 상식</span>
      </div>
    </div>

    <!-- 하단 -->
    <div class="bottom-bar">
      <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>
</body>
</html>
