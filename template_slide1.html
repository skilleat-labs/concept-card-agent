<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; }
    body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }

    .card {
      width: 1080px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 상단 컬러 히어로 블록 ── */
    .hero {
      height: 520px;
      flex-shrink: 0;
      background: linear-gradient(145deg, #3730A3 0%, #4F46E5 45%, #7C3AED 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 140px 56px;
      position: relative;
      overflow: hidden;
    }
    /* 배경 장식 원형 글로우 */
    .hero::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.09) 0%, transparent 65%);
      top: -180px; right: -100px;
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      width: 320px; height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
      bottom: -80px; left: 80px;
      pointer-events: none;
    }

    /* 상단 행: 카테고리 칩 + 슬라이드 도트 */
    .hero-top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .category-chip {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255,255,255,0.90);
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      padding: 6px 18px;
      letter-spacing: 0.03em;
    }
    .slide-dots { display: flex; gap: 9px; align-items: center; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.30); }
    .dot.active { background: #FFFFFF; width: 28px; border-radius: 5px; }

    /* 중앙 본문: 시리즈 태그 + 훅 */
    .hero-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 1;
      gap: 20px;
    }
    .series-badge {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.60);
      letter-spacing: 0.20em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 100px;
      padding: 6px 22px;
    }
    .hook {
      font-size: 58px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.25;
      letter-spacing: -0.03em;
      word-break: keep-all;
      text-align: center;
    }
    .series-label {
      font-size: 14px;
      font-weight: 700;
      color: rgba(255,255,255,0.50);
      letter-spacing: 0.05em;
    }

    /* ── 하단 화이트 섹션 ── */
    .lower {
      flex: 1;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      padding: 24px 80px 28px;
    }

    /* 다이어그램 컨테이너 */
    .diagram-container {
      flex: 1;
      background: #0F172A;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .diagram-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 하단 힌트 행 */
    .bottom-row {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .next-hint {
      font-size: 17px;
      font-weight: 700;
      color: #4F46E5;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .next-hint::after { content: ' →'; }
    .brand {
      font-size: 13px;
      font-weight: 700;
      color: #CBD5E1;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- 상단: 궁금증 유발 히어로 -->
    <div class="hero">
      <div class="hero-top">
        <span class="category-chip">{{ category }}</span>
        <div class="slide-dots">
          <div class="dot active"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
      <div class="hero-body">
        <span class="series-badge">무조건 알아야하는 IT 기본상식</span>
        <div class="hook">{{ hook | safe }}</div>
        <span class="series-label">infra.card</span>
      </div>
    </div>

    <!-- 하단: 다이어그램 미리보기 -->
    <div class="lower">
      <div class="diagram-container">
        {{ diagram_svg | safe }}
      </div>
      <div class="bottom-row">
        <span class="next-hint">다음 카드에서 확인하세요</span>
        <span class="brand">infra.card</span>
      </div>
    </div>

  </div>
</body>
</html>
