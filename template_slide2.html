<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; background: #FFFFFF; }
    body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }

    .card {
      width: 1080px;
      height: 1080px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      height: 72px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 100px;
      border-bottom: 2px solid #F1F5F9;
    }

    .category-chip {
      font-size: 14px;
      font-weight: 700;
      color: #4F46E5;
      background: #EEF2FF;
      border-radius: 100px;
      padding: 7px 20px;
    }

    .slide-dots { display: flex; gap: 9px; align-items: center; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #E2E8F0; }
    .dot.active { background: #4F46E5; width: 26px; border-radius: 5px; }

    .items-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 100px;
      gap: 12px;
    }

    .item {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 28px;
      background: #F8FAFC;
      border-radius: 18px;
      border-left: 5px solid #4F46E5;
    }

    .item-num {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #4F46E5;
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item-body {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .item-title {
      font-size: 26px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .item-desc {
      font-size: 17px;
      font-weight: 500;
      color: #64748B;
      line-height: 1.55;
      word-break: keep-all;
    }

    .bottom-bar {
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 100px;
      border-top: 2px solid #F1F5F9;
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      color: #CBD5E1;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="top-bar">
      <span class="category-chip">{{ category }}</span>
      <div class="slide-dots">
        <div class="dot"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="items-section">
      {% for item in items %}
      <div class="item">
        <div class="item-num">{{ loop.index }}</div>
        <div class="item-body">
          <div class="item-title">{{ item.title }}</div>
          <div class="item-desc">{{ item.desc }}</div>
        </div>
      </div>
      {% endfor %}
    </div>

    <div class="bottom-bar">
      <span class="brand">infra.card</span>
    </div>

  </div>
</body>
</html>
