<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; }
    body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; background: #FFFFFF; }

    .card {
      width: 1080px;
      height: 1080px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 상단 바 ── */
    .top-bar {
      height: 72px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #3730A3 0%, #4F46E5 60%, #7C3AED 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 120px;
    }
    .top-left { display: flex; align-items: center; gap: 14px; }
    .category-chip {
      font-size: 13px; font-weight: 700;
      color: rgba(255,255,255,0.95);
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      padding: 5px 16px;
    }
    .top-label {
      font-size: 16px;
      font-weight: 700;
      color: rgba(255,255,255,0.60);
    }
    .slide-dots { display: flex; gap: 8px; align-items: center; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.30); }
    .dot.active { background: #FFFFFF; width: 26px; border-radius: 5px; }

    /* ── 콘텐츠 ── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 36px 100px 38px;
      gap: 20px;
      min-height: 0;
    }

    /* 개념명 */
    .concept-title {
      font-size: 68px;
      font-weight: 900;
      color: #0F172A;
      letter-spacing: -0.04em;
      line-height: 1.0;
      flex-shrink: 0;
    }

    /* 한 줄 정의 */
    .definition-box {
      flex-shrink: 0;
      background: linear-gradient(135deg, #3730A3 0%, #4F46E5 60%, #7C3AED 100%);
      border-radius: 14px;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .def-label {
      font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,0.50);
      letter-spacing: 0.20em;
      text-transform: uppercase;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .def-divider {
      width: 1px; height: 26px;
      background: rgba(255,255,255,0.22);
      flex-shrink: 0;
    }
    .def-text {
      font-size: 21px; font-weight: 700;
      color: #FFFFFF;
      line-height: 1.45;
      word-break: keep-all;
    }

    /* 핵심 포인트 섹션 */
    .points-label {
      font-size: 12px; font-weight: 700;
      color: #94A3B8;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .points-label::after {
      content: '';
      flex: 1; height: 1px;
      background: #E2E8F0;
    }

    /* 포인트 목록 */
    .points-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    /* 개별 포인트 카드 */
    .point-item {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 22px;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 16px;
      padding: 22px 28px;
      border-left: 4px solid #4F46E5;
    }
    .point-num {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .point-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .point-title {
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .point-desc {
      font-size: 19px;
      font-weight: 500;
      color: #475569;
      line-height: 1.60;
      word-break: keep-all;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="top-bar">
      <div class="top-left">
        <span class="category-chip">{{ category }}</span>
        <span class="top-label">{{ title }}란?</span>
      </div>
      <div class="slide-dots">
        <div class="dot"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="content">

      <div class="concept-title">{{ title }}</div>

      <div class="definition-box">
        <span class="def-label">한 줄 정의</span>
        <div class="def-divider"></div>
        <span class="def-text">{{ definition }}</span>
      </div>

      <div class="points-label">핵심 기술 포인트</div>

      <div class="points-list">
        {% for point in points %}
        <div class="point-item">
          <div class="point-num">{{ loop.index }}</div>
          <div class="point-body">
            <div class="point-title">{{ point.title }}</div>
            <div class="point-desc">{{ point.desc }}</div>
          </div>
        </div>
        {% endfor %}
      </div>

    </div>
  </div>
</body>
</html>
