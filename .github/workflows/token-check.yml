name: Instagram Token Check

# 게시하지 않고 저장된 IG_ACCESS_TOKEN이 유효한지만 확인한다(계정 조회 API 1회).
# Actions 탭에서 수동 실행. 토큰 값은 출력하지 않는다.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - name: Check token (read-only)
        run: |
          code=$(curl -s -o resp.json -w '%{http_code}' \
            "https://graph.instagram.com/v21.0/me?fields=id,username&access_token=${IG_ACCESS_TOKEN}")
          echo "HTTP 상태: $code"
          if [ "$code" = "200" ]; then
            echo "✅ 토큰 유효 — 계정: @$(jq -r .username resp.json)"
            if [ "$(jq -r .id resp.json)" = "$IG_USER_ID" ]; then echo "✅ IG_USER_ID 일치"; else echo "⚠️ IG_USER_ID가 토큰의 계정 id와 다름"; fi
          else
            echo "❌ 토큰 확인 실패: $(jq -r '.error.message // "알 수 없는 오류"' resp.json) (code $(jq -r '.error.code // "-"' resp.json))"
            exit 1
          fi
